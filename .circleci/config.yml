version: 2.1

commands:
  deploy_and_verify:
    description: "Deploy Mifos Gazelle and verify health"
    steps:
      - run:
          name: Deploy via run.sh
          command: |
            chmod +x ./run.sh
            echo "Deploying on $(uname -m)..."
            sudo ./run.sh -m deploy -u "$USER" -a all -d true

      - run:
          name: Verify pods are running
          command: |
            echo "Checking pod readiness..."
            if ! command -v kubectl &> /dev/null; then
              echo "ERROR: kubectl not found"; exit 1
            fi
            if ! kubectl cluster-info &> /dev/null; then
              echo "ERROR: Cannot connect to cluster"; exit 1
            fi

            if ! kubectl wait --for=condition=Ready pods --all --all-namespaces --timeout=300s; then
              echo "Failure: Some pods are not ready"; kubectl get pods --all-namespaces; exit 1
            fi

      - run:
          name: Check ingress endpoints
          command: |
            chmod +x ./src/utils/check-endpoints.sh
            ./src/utils/check-endpoints.sh -c ./config/config.ini

      - run:
          name: Generate test data (clients + vNext registrations)
          command: |
            sudo ./run.sh -m deploy -u "$USER" -a setup-data -d true

      - run:
          name: Smoke test - make payment
          command: |
            chmod +x ./src/utils/make-payment.sh
            ./src/utils/make-payment.sh -a 10 -c ./config/config.ini

      - run:
          name: Run integration tests (cucumber)
          command: |
            # TODO: Debug cucumber tests locally against a running deployment first.
            # Once passing locally, enable by uncommenting the block below.
            #
            # git clone https://github.com/openMF/ph-ee-integration-test.git
            # cd ph-ee-integration-test
            # mvn test -Dcucumber.filter.tags="@gov and not @ext"
            echo "Cucumber tests: run locally to debug before enabling here"

jobs:
  deploy-test-amd64:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - deploy_and_verify

  deploy-test-arm64:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.large
    steps:
      - checkout
      - deploy_and_verify

workflows:
  version: 2
  test-multi-arch:
    jobs:
      - deploy-test-amd64
      # - deploy-test-arm64
